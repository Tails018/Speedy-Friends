<script>
(() => {
 const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const id=new URLSearchParams(location.search).get('id');
 const boot=()=>window.SpeedyFirebase.db.ref('speedy-friends-teams/speedy-friends/news/'+id).once('value').then(s=>{const n=s.val();if(!n||n.published===false){app.innerHTML='<div class="k">NEWSROOM</div><h1>NO DISPONIBLE</h1><p class="body">Esta novedad ya no está publicada.</p>';return}app.innerHTML=`<a class="back" href="novedades.html">← VOLVER AL ARCHIVO</a><div class="k">SPEEDY FRIENDS / ${esc(n.category||'INFO')}</div><h1>${esc(n.title||'Sin título')}</h1><div class="meta"><span class="chip">${esc(n.category||'INFO')}</span><span>${esc(n.date||'')}</span><span>PUBLICADO EN SPEEDY FRIENDS</span></div><img class="hero" src="${esc(n.image||'assets/optimized/1cdfd07e95f6-640.webp')}" alt=""><div class="article-layout"><div class="body">${esc(n.body||n.summary||'')}</div><aside class="side-note"><b>LEE.<br>COMPARTE.</b><p>Las novedades forman parte del archivo vivo de Speedy Friends. Vuelve a la portada para descubrir publicaciones anteriores y actuales.</p></aside></div>`}).catch(e=>{app.innerHTML='<div class="k">ERROR</div><h1>NO SE PUDO CARGAR</h1><p class="body">'+esc(e.message||'Error desconocido')+'</p>'});
 document.addEventListener('speedy:firebase-ready',boot,{once:true});if(window.SpeedyFirebase?.current?.uid)boot();
})();
</script></body></html>
